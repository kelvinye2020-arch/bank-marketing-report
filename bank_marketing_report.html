<body>
<header class="mast"><div class="wrap"><div class="eyebrow">WEEKLY INSIGHTS / 案例与使用体验观察</div><div class="title-row"><h1>小红书 · 营销与用户洞察</h1></div><p class="meta" id="date-line"></p><p class="notice">高赞案例优先，近期发现与变化线索单独保留。每篇一个主栏目；全文与图片可直接回查。点赞为累计关注度，不代表活动效果。</p></div></header>
<main class="wrap"><div class="metrics" id="metrics"></div><section class="quick" aria-labelledby="quick-title"><div class="section-head"><h2 id="quick-title">一分钟速览</h2><span>每栏一条重点 · 结论可回查原文</span></div><div class="quick-grid" id="overview"></div></section><div class="sticky"><nav class="tabs" role="tablist" aria-label="洞察栏目" id="tabs"></nav></div><section id="panel" role="tabpanel" aria-labelledby="tab-marketing"><div class="section-head"><h2 id="panel-title"></h2><span id="panel-count"></span></div><p class="tab-desc" id="panel-desc"></p><div class="insights" id="insights"></div><div class="section-head"><h2>证据库</h2><span>原始内容不改写 · 分析另行标注</span></div><p class="group-desc">已按重点案例、近期线索与历史参考排好；同主题资料合并阅读。</p><div id="evidence"></div></section><details class="method"><summary>阅读口径与分类说明</summary><ul id="methods"></ul></details><footer class="footer"><p></p><p id="build-line"></p></footer></main>

<script>
'use strict';
const DATA=JSON.parse(document.getElementById('report-data').textContent);
const byId=new Map(DATA.notes.map(n=>[n.id,n]));
const names={marketing:'银行营销案例',product:'产品使用洞察',sentiment:'问题与舆情关注'};
const descriptions={marketing:'看银行支付优惠、新户权益、资金入口与参与反馈。同活动或同主题合并阅读；银行活动的具体费用、履约、领奖及用券反馈保留在营销栏，不作为腾讯产品投诉。',product:'看使用选择、资金路径、会员权益与竞品比较。理财通或零钱通的具体投诉交给问题栏，不重复展示证据。',sentiment:'只看主体明确为理财通或零钱通的具体使用问题、还款手续费与服务投诉，包含负面体验及问题求助。用户自述、账户限制提示不等于已确认故障；银行活动投诉、抽奖不满、仅支付或司法及弱相关内容不补位，近期少样本如实说明。'};
const $=id=>document.getElementById(id);
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function badge(text,cls=''){return el('span','badge '+cls,text);}
function btn(text,cls,fn){const b=el('button',cls,text);b.type='button';b.addEventListener('click',fn);return b;}
function safeImage(src){return typeof src==='string'&&/^imgs\/[a-zA-Z0-9_-]+\.(jpg|jpeg|png|webp)$/.test(src)?src:'';}
function safeOrigin(src){try{const u=new URL(src);return u.protocol==='https:'&&['www.xiaohongshu.com','xiaohongshu.com'].includes(u.hostname)?u.href:'';}catch{return '';}}
function tidy(s){return (s||'').replace(/#[^#\n]+\[话题\]#/g,'').replace(/#[^#\n]+#/g,'').replace(/\[([^\]]{1,12})R\]/g,'').trim();}
function countText(ns){return `当月 ${ns.filter(n=>n.date>=DATA.month_start).length} 篇 · 近7天 ${ns.filter(n=>n.recent).length} 篇`;}
function metricText(v){return typeof v==='number'?v.toLocaleString('zh-CN'):'未取到';}
function metricOf(n){return n.display_metrics||n.evidence;}
function metricDate(n){const m=metricOf(n);return m.captured_at?m.captured_at.slice(0,16).replace('T',' '):'旧缓存 · 日期未记录';}
const recentUnique=DATA.notes.filter(n=>n.recent).length;
$('date-line').textContent=`数据截至 ${DATA.data_as_of} ｜ 当月 ${DATA.month_start} 起 ｜ 近期 ${DATA.recent_start}—${DATA.data_as_of} ｜ 历史参考 ${DATA.window_start} 起`;
for(const [num,label,detail] of [[DATA.source_count,'可查看的原始证据','仅统计三个主栏目，单一归属'],[recentUnique,'近7天发布','不等于本轮首次发现'],[DATA.counts.direct,'具体问题与负面','含问题求助，均待核验'],[DATA.image_count,'可查看的本地图片','全文与已有评论保持原样']]){const m=el('div','metric');m.append(el('b','',num),el('span','',label),el('small','',detail));$('metrics').append(m);}
DATA.overview.forEach((s,i)=>{const c=el('article','quick-item');c.append(el('div','number',`0${i+1} / ${names[s.tab]}`),el('h3','',s.title),el('p','',s.body),btn('进入栏目看摘要与证据 →','text-button',()=>{switchTab(s.tab);$('tabs').scrollIntoView({block:'start',behavior:'smooth'});}));$('overview').append(c);});
let activeTab='marketing',currentNote=null,imageIndex=0,returnFocus=null;
for(const g of Object.keys(names)){const b=btn('', 'tab',()=>switchTab(g));b.id='tab-'+g;b.role='tab';b.setAttribute('aria-controls','panel');b.append(el('span','',names[g]),el('span','tab-count',DATA.notes.filter(n=>n.sections.includes(g)).length));$('tabs').append(b);}
function switchTab(g){activeTab=g;for(const b of $('tabs').children){const selected=b.id==='tab-'+g;b.setAttribute('aria-selected',selected);b.tabIndex=selected?0:-1;}$('panel').setAttribute('aria-labelledby','tab-'+g);$('panel-title').textContent=names[g]+' · 本期值得看';$('panel-desc').textContent=descriptions[g];$('panel-count').textContent=countText(DATA.notes.filter(n=>n.sections.includes(g)));renderInsights();renderEvidence();}
$('tabs').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();const gs=Object.keys(names);let i=gs.indexOf(activeTab);i=e.key==='Home'?0:e.key==='End'?gs.length-1:(i+(e.key==='ArrowRight'?1:-1)+gs.length)%gs.length;switchTab(gs[i]);$('tab-'+gs[i]).focus();});
function renderInsights(){$('insights').replaceChildren();DATA.insights[activeTab].forEach((s,i)=>{const c=el('article','insight');const number=el('div','insight-number',String(i+1).padStart(2,'0'));number.setAttribute('aria-hidden','true');const main=el('div','insight-main');main.append(el('div','scope',s.scope),el('h3','',s.title),el('p','insight-body',s.body));const a=el('div','action');a.append(el('b','','建议关注：'),document.createTextNode(s.action));main.append(a);const refs=el('div','refs');refs.append(el('div','reference-label','原始证据'));const sorted=s.refs.map(id=>byId.get(id)).filter(Boolean).sort((a,b)=>(metricOf(b).likes||0)-(metricOf(a).likes||0)).slice(0,2);sorted.forEach(n=>{const box=el('div','ref-box');box.append(btn(n.title,'ref',()=>openNote(n.id)),el('p','ref-meta',`${n.date} 发布 · 累计点赞 ${metricText(metricOf(n).likes)}`));refs.append(box);});if(!s.refs.length)refs.append(el('p','no-ref','本期暂无对应新发样本，不推断全平台情况。'));c.append(number,main,refs);$('insights').append(c);});}
function makeCard(n){const c=el('article','note'+(n.attitude==='负面体验'&&n.sentiment_kind!=='related'?' negative':''));c.dataset.noteId=n.id;const tags=el('div','tags');tags.append(badge(n.object,'obj'),badge(n.attitude,n.attitude==='负面体验'?'bad':n.attitude==='疑问求助'?'ask':n.attitude==='正向体验'?'good':''));n.topics.slice(0,3).forEach(t=>tags.append(badge(t)));if(n.recent)tags.append(badge('近7天发布','new'));if(n.event_status)tags.append(badge(n.event_status,'new'));c.append(tags);const head=el('h3');head.append(btn(n.title,'note-title',()=>openNote(n.id)));c.append(head,el('p','byline',`${n.date} · ${n.author}`),el('p','byline',`互动：${metricDate(n)}${n.metrics_refreshed?' · 已采快照':' · 保存值'}`));c.append(el('p','snippet',tidy(n.evidence.desc)||'原文主要信息在图片中，打开全文查看。'));if(n.analyst_note)c.append(el('div','analysis',n.analyst_note));const stats=el('div','stats');for(const [f,t] of [['likes','点赞'],['collects','收藏'],['comments','评论'],['shares','分享']]){const s=el('span','',t);s.append(el('b','',metricText(metricOf(n)[f])));stats.append(s);}const bottom=el('div','bottom');bottom.append(btn('查看全文与图片','primary',()=>openNote(n.id)));if((n.evidence.cmts||[]).length)bottom.append(el('span','coverage',`已采评论 ${n.evidence.cmts.length} 条`));c.append(stats,bottom);return c;}
function appendEvents(ns,grid){const groups=new Map();for(const n of ns){const key=n.event_key||n.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(n);}for(const list of groups.values()){if(list.length===1){grid.append(makeCard(list[0]));continue;}const box=el('div','event-group');box.style.minWidth='0';box.append(el('p','group-desc',`${list[0].event_label||'同活动参考'} · ${list.length} 篇`),makeCard(list[0]));const more=el('details','history');more.append(el('summary','',`查看其余 ${list.length-1} 篇原始证据`));list.slice(1).forEach(n=>more.append(makeCard(n)));box.append(more);grid.append(box);}}
function renderEvidence(){const parent=$('evidence');parent.replaceChildren();const groups=DATA.reading_groups[activeTab]||[];if(activeTab==='sentiment'&&!DATA.notes.some(n=>n.primary_section===activeTab&&n.recent))parent.append(el('p','archive-note','近7天未检出入选的具体问题样本；下方保留当月与历史问题，不代表平台没有相关讨论。'));for(const group of groups){const count=group.events.reduce((a,e)=>a+e.ids.length,0);const folded=['month','history'].includes(group.key);const section=el(folded?'details':'section',folded?'history':'reading-group');section.dataset.layer=group.key;if(folded){section.open=group.open;section.append(el('summary','',`${group.title} · ${count} 篇`));}else{const band=el('div','label-band');band.append(el('b','',group.title),badge(`${count} 篇`));section.append(band);}section.append(el('p','group-desc',group.note));let events=group.events,restEvents=[];if(['recent','month','history'].includes(group.key)&&events.length>9){restEvents=events.slice(9);events=events.slice(0,9);}const grid=el('div','grid');for(const event of events){const ns=event.ids.map(id=>byId.get(id)).filter(Boolean);appendEvents(ns,grid);}section.append(grid);if(restEvents.length){const restCount=restEvents.reduce((a,e)=>a+e.ids.length,0);const more=el('details','history');more.append(el('summary','',`还有 ${restCount} 篇，点击展开`));const restGrid=el('div','grid');for(const event of restEvents){const ns=event.ids.map(id=>byId.get(id)).filter(Boolean);appendEvents(ns,restGrid);}more.append(restGrid);section.append(more);}parent.append(section);}}
function showImage(){if(!currentNote)return;const imgs=currentNote.evidence.imgs||[];if(!imgs.length){$('carousel').hidden=true;return;}$('carousel').hidden=false;imageIndex=(imageIndex+imgs.length)%imgs.length;const img=$('note-image');img.onerror=()=>{$('image-status').textContent='图片未能加载，可检查随版图片或查看原帖';};img.src=safeImage(imgs[imageIndex]);$('image-status').textContent=`${imageIndex+1} / ${imgs.length}`;$('prev-image').disabled=imgs.length<2;$('next-image').disabled=imgs.length<2;}
function slide(step){if(!currentNote||(currentNote.evidence.imgs||[]).length===0)return;imageIndex+=step;showImage();}
function openNote(id){const n=byId.get(id);if(!n)return;returnFocus=document.activeElement;currentNote=n;imageIndex=0;const ev=n.evidence;$('note-title').textContent=n.title;$('note-meta').textContent=`作者：${n.author} ｜ 发布：${ev.pub||n.date} ｜ ${n.date_basis}`;$('note-tags').replaceChildren(badge(n.object,'obj'),badge(n.attitude),...n.topics.map(t=>badge(t)));$('note-analysis').textContent=`分析／核验状态：${n.verification}。${n.analyst_note||'主题与态度按标题及全文规则初判，不代表原帖事实已核验。'}`;$('note-text').textContent=ev.desc||'（原始笔记无正文，请查看图片）';$('note-stats').replaceChildren();for(const [k,l] of [['likes','累计点赞'],['collects','累计收藏'],['comments','累计评论'],['shares','累计分享']])$('note-stats').append(el('span','',`${l} ${metricText(metricOf(n)[k])}`));$('note-stats').append(el('p','meta',`互动采集：${metricDate(n)}；全文与评论保留原采集内容，时点可能不同。`));const cmts=ev.cmts||[];$('comment-title').textContent=`评论样本 ${cmts.length} 条 · 累计评论 ${metricText(metricOf(n).comments)}`;$('comment-info').textContent=cmts.length?'已有采样，非实时、非已验证热门排序；采样时间可能早于互动刷新，评论说法亦未经核验。':metricOf(n).comments===0?'该次快照评论数为0，本版无评论样本。':'本版缺少评论样本，不代表没有讨论，不能据此判断评论态度。';$('comments').replaceChildren();cmts.forEach(c=>{const box=el('div','comment');box.append(el('p','comment-head',`${c.u||'匿名用户'} · ${c.d||''} · 点赞 ${metricText(c.likes)}`),el('p','',c.c||''));$('comments').append(box);});const u=safeOrigin(ev.url);$('original').hidden=!u;if(u)$('original').href=u;showImage();if(!$('note-dialog').open)$('note-dialog').showModal();$('note-dialog').scrollTop=0;document.body.style.overflow='hidden';$('close-note').focus();}
function closeNote(){$('note-dialog').close();currentNote=null;document.body.style.overflow='';if(returnFocus&&returnFocus.isConnected)returnFocus.focus();}
$('close-note').addEventListener('click',closeNote);$('note-dialog').addEventListener('cancel',e=>{e.preventDefault();closeNote();});$('note-dialog').addEventListener('click',e=>{if(e.target===$('note-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeNote();}});
$('prev-image').addEventListener('click',()=>slide(-1));$('next-image').addEventListener('click',()=>slide(1));
$('enlarge').addEventListener('click',()=>{if(!currentNote)return;const src=safeImage((currentNote.evidence.imgs||[])[imageIndex]);if(!src)return;$('zoom-image').src=src;$('zoom-dialog').showModal();$('zoom-dialog').scrollTop=0;$('close-zoom').focus();});
function closeZoom(){$('zoom-dialog').close();$('enlarge').focus();}$('close-zoom').addEventListener('click',closeZoom);$('zoom-dialog').addEventListener('cancel',e=>{e.preventDefault();closeZoom();});
document.addEventListener('keydown',e=>{const d=$('zoom-dialog').open?$('zoom-dialog'):$('note-dialog').open?$('note-dialog'):null;if(!d)return;if(e.key==='Tab'){const nodes=[...d.querySelectorAll('button:not([disabled]),a[href],input,select,[tabindex="0"]')].filter(n=>!n.hidden&&n.offsetParent!==null);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if(!$('zoom-dialog').open&&currentNote&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();slide(e.key==='ArrowLeft'?-1:1);}});
for(const text of [`时间怎么算：当月指${DATA.month_start}至${DATA.data_as_of}；近7天指${DATA.recent_start}—${DATA.data_as_of}；更早的收在历史参考。日期按帖子详情页的发布时间，拿不到准确日期的不公开。`,DATA.coverage_note,'怎么选的：高赞案例和近期线索分开选，同主题放在一起读。刚发的帖子不等于新活动，优惠金额、资格和有效期以官方页面为准。','点赞等互动是采集时的累计数，旁边标了采集时间；没取到的写“未取到”，不拿旧数冒充新数据。这里没有“本周新增多少”的统计。','原文、图片和评论都不改动。评论只采了少量样本，没采到不代表没人讨论；用户自己说的内容，不等于已经核实的故障或官方说法。'])$('methods').append(el('li','',text));
const publicationLabels={draft:'草稿',ready:'本期已审样本',published:'本期已审样本 · 已上线'};
const publicationLabel=publicationLabels[DATA.publication.status];
document.title=`小红书 · 营销与用户洞察 | ${DATA.version}`;
document.querySelector('.footer p').textContent=DATA.publication_notice;
$('build-line').textContent=`版式生成：${DATA.built_at} ｜ ${DATA.version} ${publicationLabel}${DATA.publication.deployed_at?' ｜ 部署时点 '+DATA.publication.deployed_at:''}`;
switchTab('marketing');
</script>
